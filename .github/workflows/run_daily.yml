name: Sijishe Daily Check-in

on:
  schedule:
    - cron: '0 1 * * *'   # 北京时间 9:00
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run check-in
        env:
          SIJISHE_USERNAME: ${{ secrets.SIJISHE_USERNAME }}
          SIJISHE_PASSWORD: ${{ secrets.SIJISHE_PASSWORD }}
        run: python sijishe.py
